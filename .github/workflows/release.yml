name: Release Creation

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon & Intel
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04' # Linux
            args: ''
          - platform: 'windows-2022' # Windows
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Fix FFmpeg permissions (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu

      - name: Combine FFmpeg binaries (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          # Fusionamos el binario de Intel y el de ARM para crear el Universal
          lipo -create src-tauri/binaries/ffmpeg-x86_64-apple-darwin src-tauri/binaries/ffmpeg-aarch64-apple-darwin -output src-tauri/binaries/ffmpeg-universal-apple-darwin
          # Le damos permisos de ejecución
          chmod +x src-tauri/binaries/ffmpeg-universal-apple-darwin

      # Configuración del entorno de Node.js para compilar el frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Instalación de las dependencias de npm antes de compilar con Tauri
      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Open Pulse v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}