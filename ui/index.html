<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="style.css">

    <script src="audio-manager.js"></script>

    <script src="main.js" defer></script>

    <script src="video.js" defer></script>
    <script src="audio.js" defer></script>
</head>
<body>
    <div id="intro-overlay">
        <div class="logo-pulse">
            <span>OPEN</span>PULSE
        </div>
    </div>

    <div class="app-container">
        <nav class="sidebar">
            <div class="menu-item active" data-target="video-section">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18" /><line x1="7" y1="2" x2="7" y2="22" /><line x1="17" y1="2" x2="17" y2="22" /><line x1="2" y1="12" x2="22" y2="12" /><line x1="2" y1="7" x2="7" y2="7" /><line x1="2" y1="17" x2="7" y2="17" /><line x1="17" y1="17" x2="22" y2="17" /><line x1="17" y1="7" x2="22" y2="7" /></svg>
                <span class="label">Video Tools</span>
            </div>
            <div class="menu-item" data-target="audio-section">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>
                <span class="label">Audio Tools</span>
            </div>
            <div style="flex-grow: 1;"></div>
            <div id="btn-view-logs" style="opacity: 0.3; font-size: 0.7rem; text-align: center; cursor: pointer; padding: 10px; transition: opacity 0.3s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.3'">Ver Logs</div>
        </nav>

        <main class="content-area">
            <section id="video-section" class="active-section">
                <h1 class="section-title">VIDEO<span>PULSE</span></h1>
                <div class="drop-zone">
                    <p>Drag your VIDEO here</p>
                </div>
            </section>

            <section id="audio-section">
                <h1 class="section-title">AUDIO<span>PULSE</span></h1>
                <div class="drop-zone">
                    <p>Drag your AUDIO here</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Log Modal -->
    <div id="logs-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: #1e293b; width: 80%; height: 80%; border-radius: 8px; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="color: white; margin: 0; font-size: 1.2rem;">OpenPulse Logs</h2>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-refresh-logs" style="background: #3b82f6; border: none; color: white; padding: 5px 15px; border-radius: 4px; cursor: pointer;">Refrescar</button>
                    <button id="btn-close-logs" style="background: #ef4444; border: none; color: white; padding: 5px 15px; border-radius: 4px; cursor: pointer;">Cerrar</button>
                </div>
            </div>
            <textarea id="logs-content" readonly style="flex-grow: 1; background: #0f172a; color: #a7f3d0; border: 1px solid #334155; border-radius: 4px; padding: 10px; font-family: monospace; font-size: 0.9rem; resize: none; outline: none;"></textarea>
        </div>
    </div>
</body>
</html>
